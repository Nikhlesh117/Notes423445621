services:
  - type: web
    name: ai-ml-notes
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false   # optional — only needed for the "Generate with AI" flow; all notes are pre-written
